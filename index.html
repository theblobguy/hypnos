<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1430">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hypnos">
<title>Hypnos sleep</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, kind, a little nocturnal; never scolding.
   IDEA: a night chart: the clock face a sailor or astronomer reads at night.
   PICTURE: a 24-hour dial with tonight's sleep arc, wind-down arc and the wake mark.
   COLOUR and TYPE: aubergine night, moonlight ink, dawn rose accent; Newsreader for times, Figtree for UI.
   LAYOUT: one phone column, tab bar at the bottom, the dial first on Tonight. */
:root{
  color-scheme:dark;
  --night:#1b1430;--deep:#140f25;--panel:#241b3e;--panel2:#2d2350;
  --moon:#efe9f7;--mist:#a99fc4;--faint:#7a7096;--line:rgba(239,233,247,.12);
  --rose:#f3a6bb;--rose2:#c97c96;
  --low:#8fd6c8;--mod:#e9c27e;--high:#f08f84;
  --r:18px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--moon);font:16px/1.5 Figtree,system-ui,-apple-system,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(1px 1px at 12% 18%,rgba(255,255,255,.55),transparent 60%),
  radial-gradient(1px 1px at 78% 9%,rgba(255,255,255,.45),transparent 60%),
  radial-gradient(1.5px 1.5px at 64% 31%,rgba(255,255,255,.35),transparent 60%),
  radial-gradient(1px 1px at 33% 42%,rgba(255,255,255,.3),transparent 60%),
  radial-gradient(1px 1px at 90% 55%,rgba(255,255,255,.3),transparent 60%),
  radial-gradient(120% 60% at 50% -10%,#2f2456 0%,transparent 60%)}
main{position:relative;max-width:560px;margin:0 auto;padding:calc(var(--sat) + 18px) 18px calc(var(--sab) + 96px)}
h1,h2,h3{font-family:Newsreader,Georgia,serif;font-weight:500;line-height:1.08;margin:0;text-wrap:balance}
h1{font-size:34px}h2{font-size:24px}h3{font-size:19px}
p{margin:0}
.muted{color:var(--mist)}.small{font-size:14px}.tiny{font-size:13px;color:var(--faint)}
.stack{display:grid;gap:14px}
.sec{margin-top:26px}
.panel{background:var(--panel);border-radius:var(--r);padding:18px}
.panel.quiet{background:transparent;border:1px solid var(--line)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.big{font-family:Newsreader,Georgia,serif;font-size:clamp(40px,12vw,56px);line-height:1;font-weight:500;white-space:nowrap}
.mid{font-family:Newsreader,Georgia,serif;font-size:28px;line-height:1.1;white-space:nowrap}
.nowrap{white-space:nowrap}
button,.btn{font:inherit;font-weight:600;color:var(--deep);background:var(--rose);border:0;border-radius:999px;min-height:48px;padding:0 22px;cursor:pointer}
button.ghost,.btn.ghost{background:transparent;color:var(--moon);border:1px solid var(--line)}
button.link{background:none;color:var(--rose);padding:0;min-height:44px;font-weight:500}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label.chip:focus-within{outline:2px solid var(--rose);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.full{width:100%}
label.f{display:grid;gap:6px;font-size:14px;color:var(--mist)}
input,select,textarea{font:inherit;font-size:16px;color:var(--moon);background:var(--deep);border:1px solid var(--line);border-radius:12px;min-height:48px;padding:10px 12px;width:100%}
input[type=time],input[type=date]{color-scheme:dark}
textarea{min-height:110px;font-size:14px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{background:var(--deep);color:var(--moon);border:1px solid var(--line);min-height:44px;padding:0 16px;font-weight:500}
.seg button[aria-pressed=true]{background:var(--rose);color:var(--deep);border-color:var(--rose)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
label.chip{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--deep);cursor:pointer;font-size:15px}
label.chip input{position:absolute;opacity:0;width:1px;height:1px}
label.chip:has(input:checked){background:var(--panel2);border-color:var(--rose);color:var(--moon)}
label.chip:has(input:checked)::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--rose)}
.check{display:flex;gap:12px;align-items:flex-start;min-height:44px;padding:6px 0;cursor:pointer}
.check input{width:22px;height:22px;min-height:0;margin:2px 0 0;accent-color:var(--rose);flex:none}
/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(20,15,37,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:var(--sab)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
nav.tabs button{background:none;color:var(--faint);border-radius:0;min-height:62px;font-weight:500;font-size:13px;display:grid;place-items:center;gap:2px;padding:6px 0}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current=page]{color:var(--rose)}
/* dial */
.dialwrap{display:grid;place-items:center;margin:6px 0 4px}
.dial{width:min(330px,86vw);aspect-ratio:1;display:block}
.dial text{font-family:Figtree,sans-serif}
.legend{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--mist)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
/* debt meter */
.meter{position:relative;height:12px;border-radius:999px;background:linear-gradient(90deg,var(--low) 0 20%,var(--mod) 20% 50%,var(--high) 50% 100%);opacity:.9}
.meter b{position:absolute;top:-5px;width:4px;height:22px;border-radius:2px;background:var(--moon);box-shadow:0 0 0 3px var(--night);transform:translateX(-2px)}
.meterlab{display:flex;justify-content:space-between;font-size:13px;color:var(--faint);margin-top:6px}
.band{display:inline-block;padding:2px 10px;border-radius:999px;font-size:14px;font-weight:600;color:var(--deep)}
.b-Low{background:var(--low)}.b-Moderate{background:var(--mod)}.b-High{background:var(--high)}
/* flags */
.flag{border-left:3px solid var(--mod);background:var(--panel);border-radius:12px;padding:14px 16px}
.flag.urgent{border-color:var(--high)}
.flag h3{font-size:18px;margin-bottom:4px}
/* charts */
.bars{position:relative;height:170px;display:flex;align-items:flex-end;gap:3px;padding-top:8px;border-bottom:1px solid var(--line)}
.bars .c{flex:1;display:flex;align-items:flex-end;height:100%;position:relative}
.bars .c span{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--rose2)}
.bars .c span.short{background:var(--faint)}
.bars .c span.none{background:transparent;border:1px dashed var(--line);height:12%!important}
.bars .need{position:absolute;left:0;right:0;border-top:2px dashed var(--moon);opacity:.7;pointer-events:none}
.bars .needlab{position:absolute;right:0;transform:translateY(-120%);font-size:12px;color:var(--moon);background:var(--night);padding:0 4px}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-top:6px}
.acto{display:grid;gap:4px}
.acto .r{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;gap:8px;font-size:12px;color:var(--faint)}
.acto .t{position:relative;height:14px;background:rgba(239,233,247,.04);border-radius:7px}
.acto .t span{position:absolute;top:0;bottom:0;border-radius:7px;background:var(--rose2)}
.acto .t .tgt{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--moon);opacity:.55}
.acto .ax{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;font-size:12px;color:var(--faint)}
.acto .ax div{display:flex;justify-content:space-between}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;font-size:15px}
.kv dt{color:var(--mist)}.kv dd{margin:0;text-align:right;white-space:nowrap}
.list{display:grid;gap:2px}
.list .it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.dots{display:flex;gap:3px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--rose)}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 80px);transform:translateX(-50%);background:var(--moon);color:var(--deep);padding:10px 18px;border-radius:999px;font-weight:600;z-index:9;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
.ob{min-height:calc(100vh - 140px);display:grid;align-content:start;gap:20px}
.progress{display:flex;gap:6px}.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}.progress i.on{background:var(--rose)}
.moonart{width:120px;height:120px;margin:10px 0 4px}
.banner{background:var(--panel2);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--mist);margin-bottom:14px}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--rose)}
@media (prefers-reduced-motion:no-preference){.sweep{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:sweep 1.1s ease-out .15s forwards}@keyframes sweep{to{stroke-dashoffset:0}}}
@media(max-width:380px){h1{font-size:30px}.grid2{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<nav class="tabs" id="tabs" hidden>
  <div class="in">
    <button data-tab="tonight"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>Tonight</button>
    <button data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="16" height="17" rx="3"/><path d="M8 2.5v3M16 2.5v3M8 11h8M8 15h5"/></svg>Log</button>
    <button data-tab="trends"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20V10M10 20V5M16 20v-7M22 20H2"/></svg>Trends</button>
    <button data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>You</button>
  </div>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
{
/* ---------- storage ---------- */
const KEY='hypnos.v1';
let mem=null;
const load=()=>{try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return mem}};
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){mem=JSON.parse(JSON.stringify(S))}};
let S=load();

/* ---------- time helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const toMin=t=>{const [h,m]=String(t||'0:0').split(':').map(Number);return (h||0)*60+(m||0)};
const mod=(m,n=1440)=>((m%n)+n)%n;
const hhmm=m=>{m=Math.round(mod(m));return pad(Math.floor(m/60))+':'+pad(m%60)};
const fmtT=m=>{m=Math.round(mod(m));let h=Math.floor(m/60),mi=m%60,ap=h<12?'am':'pm';h=h%12||12;return h+':'+pad(mi)+' '+ap};
const fmtD=h=>{const neg=h<0;let t=Math.round(Math.abs(h)*60);const s=Math.floor(t/60)+'h '+pad(t%60)+'m';return (neg?'−':'')+s};
const span=(a,b)=>mod(toMin(b)-toMin(a))/60;
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d)};
const today=()=>keyOf(new Date());
const dayName=k=>parseKey(k).toLocaleDateString('en-CA',{weekday:'short'});
const dayLabel=k=>parseKey(k).toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'});
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const median=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),i=s.length>>1;return s.length%2?s[i]:(s[i-1]+s[i])/2};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* minutes after 18:00, so bedtimes around midnight sort and average correctly */
const rel18=m=>mod(m-1080);

/* ---------- sleep science ---------- */
const TAGS=[['caffeine','Caffeine after 2 pm'],['alcohol','Alcohol'],['workout','Late workout'],['screens','Screens in bed'],['meal','Late meal'],['stress','Stressful day']];
const LAMBDA=0.87,WINDOW=14;
const WSUM=Array.from({length:WINDOW},(_,j)=>LAMBDA**j).reduce((a,b)=>a+b,0);
const weight=i=>WINDOW*LAMBDA**i/WSUM;
const nightDur=n=>span(n.onset,n.wake)+(Number(n.nap)||0)/60;

function chrono(p){
  const SDw=span(p.workSleep,p.workWake),SDf=span(p.freeSleep,p.freeWake);
  const MSW=mod(toMin(p.workSleep)+SDw*30),MSF=mod(toMin(p.freeSleep)+SDf*30);
  const wd=clamp(Number(p.workDays),0,7);
  const SDweek=(wd*SDw+(7-wd)*SDf)/7;
  const MSFsc=SDf>SDw?mod(MSF-0.5*(SDf-SDweek)*60):MSF;
  let sjl=Math.abs(MSF-MSW);if(sjl>720)sjl=1440-sjl;
  const h=(mod(MSFsc+720)/60)-12; /* hours after midnight, -12..12 */
  const type=h<3?'Early':h<=5?'Intermediate':'Late';
  return {SDw,SDf,MSW,MSF,MSFsc,sjl:sjl/60,type,SDweek};
}
function seedNeed(p){
  const base=p.age==='65+'?7.5:8;
  let s=base;
  if(!p.freeAlarm){const SDf=span(p.freeSleep,p.freeWake);if(SDf>=6&&SDf<=11)s=(base+SDf)/2}
  return Math.round(clamp(s,7,p.age==='65+'?9:9.5)*4)/4;
}
const bandOf=d=>d<2?'Low':d<=5?'Moderate':'High';
function durMap(){const m={};for(const [k,n] of Object.entries(S.nights||{}))m[k]=nightDur(n);return m}
function computeDebt(map,need,asOf){
  const vals=[];for(let i=0;i<WINDOW;i++){const k=addDays(asOf,-i);if(map[k]!=null)vals.push(map[k])}
  if(vals.length<5)return {ready:false,count:vals.length};
  const fill=median(vals);let sum=0;
  for(let i=0;i<WINDOW;i++){const k=addDays(asOf,-i);const d=map[k]!=null?map[k]:fill;sum+=weight(i)*clamp(need-d,-2,need)}
  const debt=Math.max(0,sum);
  return {ready:true,count:vals.length,debt,band:bandOf(debt)};
}
const asOfKey=()=>S.nights&&S.nights[today()]?today():addDays(today(),-1);
function loggedKeys(days,end=today()){const out=[];for(let i=0;i<days;i++){const k=addDays(end,-i);if(S.nights[k])out.push(k)}return out}

function flags(debt){
  const f=[],p=S.profile;
  const recent=loggedKeys(3);
  if(recent.some(k=>S.nights[k].drowsy))f.push({lvl:'urgent',id:'drowsy',t:'You felt drowsy while driving',b:'Pull over and nap, or don’t drive when you feel this way. If it keeps happening, talk to a doctor; it can be a sign of a sleep disorder.'});
  if(p.stopbang>=3&&!S.dismiss?.stopbang)f.push({lvl:'warn',id:'stopbang',t:'Worth asking a doctor about your breathing',b:'Your answers to the breathing questions scored '+p.stopbang+' of 8. That’s a common reason to get checked for sleep apnea. Sleeping longer won’t fix apnea, so it’s worth ruling out.',x:true});
  const last7=loggedKeys(7);
  const trouble=last7.filter(k=>S.nights[k].trouble).length;
  if(trouble>=3)f.push({lvl:'warn',id:'insomnia',t:'Trouble sleeping on '+trouble+' of your last '+last7.length+' nights',b:'When the problem is falling or staying asleep, more time in bed usually makes it worse, so Hypnos has stopped adding extra time. If this lasts for weeks, a doctor can refer you to CBT-I, the first-line treatment for insomnia.'});
  if(last7.length>=5&&debt.ready&&debt.band==='Low'){const r=avg(last7.map(k=>S.nights[k].rested));if(r<=2)f.push({lvl:'warn',id:'sleepy',t:'Still tired even though you’re sleeping enough',b:'Feeling unrested with little sleep debt can have causes a tracker can’t see. Mention it to a doctor.'})}
  const l14=loggedKeys(14);
  if(l14.length>=7){const d=avg(l14.map(k=>nightDur(S.nights[k]))),r=avg(l14.map(k=>S.nights[k].rested));if(d>9.5&&r<=2.5)f.push({lvl:'warn',id:'long',t:'Long sleep, still tired',b:'You’re averaging '+fmtD(d)+' and still rate your rest low. Regularly long sleep is more often a sign of a health issue than a cause, so check in with a doctor.'})}
  return f;
}
function plan(){
  const p=S.profile,need=S.need.hours,asOf=asOfKey();
  const map=durMap(),debt=computeDebt(map,need,asOf);
  const fl=flags(debt);
  const hold=fl.some(x=>x.id==='insomnia');
  let extra=0;if(debt.ready&&!hold)extra=debt.band==='High'?60:debt.band==='Moderate'?30:0;
  const wake=toMin(p.workWake),target=need+extra/60,lat=Number(p.latency)||15;
  const lightsOut=mod(wake-target*60-lat);
  const windDown=mod(lightsOut-(Number(p.windDown)||45));
  const asleep=mod(lightsOut+lat);
  const mid=mod(asleep+target*30);
  const c=chrono(p);
  let diff=mod(c.MSFsc-mid);if(diff>720)diff-=1440; /* + means body clock later than plan */
  let payoff=null;
  if(debt.ready&&debt.band!=='Low'&&extra>0){
    const m={...map};
    for(let d=1;d<=28;d++){const k=addDays(asOf,d);m[k]=target;const r=computeDebt(m,need,k);if(r.debt<2){payoff=k;break}}
  }
  return {need,extra,target,lat,wake,lightsOut,windDown,asleep,mid,debt,flags:fl,hold,chronoGap:diff/60,payoff,asOf};
}
function maybeLearn(){
  const n=S.need;if(n.manual)return null;
  if(n.updated&&(parseKey(today())-parseKey(n.updated))/864e5<7)return null;
  if(loggedKeys(42).length<21)return null;
  const d=computeDebt(durMap(),n.hours,asOfKey());if(!d.ready||d.band!=='Low')return null;
  const cand=loggedKeys(28).map(k=>S.nights[k]).filter(x=>x.noAlarm&&x.rested>=4).map(nightDur);
  if(cand.length<4)return null;
  const delta=clamp(median(cand)-n.hours,-0.25,0.25);
  n.updated=today();
  if(Math.abs(delta)<0.05)return null;
  const from=n.hours;n.hours=Math.round(clamp(n.hours+delta,7,9.5)*12)/12;
  (n.history||(n.history=[])).push({date:today(),from,to:n.hours});
  return {from,to:n.hours};
}
function consistency(){
  const keys=Object.keys(S.nights).sort();
  const ok={};
  keys.forEach((k,i)=>{
    const prev=keys.slice(Math.max(0,i-14),i).map(x=>rel18(toMin(S.nights[x].onset)));
    if(prev.length<3)return;
    ok[k]=Math.abs(rel18(toMin(S.nights[k].onset))-median(prev))<=30;
  });
  let streak=0;let k=asOfKey();
  while(S.nights[k]&&ok[k]){streak++;k=addDays(k,-1)}
  return {ok,streak};
}
function spread(keys,field){
  const v=keys.map(k=>rel18(toMin(S.nights[k][field])));if(v.length<3)return null;
  const a=avg(v);return Math.sqrt(avg(v.map(x=>(x-a)**2)));
}
function tagInsights(){
  const keys=loggedKeys(60),out=[];
  for(const [id,label] of TAGS){
    const yes=keys.filter(k=>(S.nights[k].tags||[]).includes(id)),no=keys.filter(k=>!(S.nights[k].tags||[]).includes(id));
    if(yes.length<3||no.length<3)continue;
    const dd=avg(yes.map(k=>nightDur(S.nights[k])))-avg(no.map(k=>nightDur(S.nights[k])));
    const dr=avg(yes.map(k=>S.nights[k].rested))-avg(no.map(k=>S.nights[k].rested));
    out.push({id,label,dd,dr,n1:yes.length,n0:no.length});
  }
  return out.sort((a,b)=>(a.dd+a.dr/3)-(b.dd+b.dr/3));
}

/* ---------- ui state ---------- */
let tab='tonight',ob={step:0,p:null},editKey=null,eraseArm=false;
const app=document.getElementById('app'),tabs=document.getElementById('tabs');
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)}
const seg=(name,opts,val)=>'<div class="seg" role="group">'+opts.map(([v,l])=>'<button type="button" data-seg="'+name+'" data-v="'+v+'" aria-pressed="'+(String(v)===String(val))+'">'+l+'</button>').join('')+'</div>';

/* ---------- onboarding ---------- */
const SB=[['s','Do you snore loudly, loud enough to hear through a closed door?'],['t','Do you often feel tired or sleepy during the day?'],['o','Has anyone seen you stop breathing or choke during sleep?'],['p','Do you have, or are you treated for, high blood pressure?'],['b','Is your BMI over 35?'],['a','Are you over 50?'],['n','Is your neck size large (shirt collar 43 cm / 17 in or more for men, 41 cm / 16 in for women)?'],['g','Are you male?']];
function defaultsProfile(){return {age:'18-64',workDays:5,shift:false,workSleep:'23:15',workWake:'06:30',freeSleep:'00:30',freeWake:'08:30',freeAlarm:false,latency:15,windDown:45,sb:{},stopbang:0}}
function renderOnboarding(){
  tabs.hidden=true;
  const p=ob.p||(ob.p=defaultsProfile()),st=ob.step,N=6;
  const prog='<div class="progress">'+Array.from({length:N},(_,i)=>'<i class="'+(i<st?'on':'')+'"></i>').join('')+'</div>';
  const nav=(next='Next',dis=false)=>'<div class="row between"><button class="ghost" data-act="ob-back">Back</button><button data-act="ob-next" '+(dis?'disabled':'')+'>'+next+'</button></div>';
  let h='';
  if(st===0){
    h='<div class="ob"><svg class="moonart" viewBox="0 0 120 120" aria-hidden="true"><defs><radialGradient id="mg" cx="40%" cy="35%"><stop offset="0" stop-color="#fff8ff"/><stop offset="1" stop-color="#d9cdef"/></radialGradient></defs><circle cx="60" cy="60" r="44" fill="url(#mg)"/><circle cx="80" cy="48" r="40" fill="#1b1430"/><circle cx="96" cy="22" r="1.6" fill="#efe9f7"/><circle cx="104" cy="70" r="1.2" fill="#efe9f7"/></svg>'+
      '<h1>Sleep on a schedule that fits you</h1><p class="muted">Hypnos works out how much sleep you need, when to go to bed, and how much sleep you owe. Log each morning in about ten seconds; no watch needed.</p>'+
      '<p class="tiny">For adults 18 and over. Hypnos is a habit tool, not a medical device, and doesn’t diagnose or treat sleep disorders.</p>'+
      '<div class="stack"><button class="full" data-act="ob-next">Set up my schedule</button><button class="ghost full" data-act="sample">Try it with sample nights</button></div></div>';
  } else if(st===1){
    h='<div class="ob">'+prog+'<h2>About you</h2><div class="stack"><div><p class="small muted">Age</p>'+seg('age',[['18-64','18 to 64'],['65+','65 or older']],p.age)+'</div>'+
      '<div><p class="small muted">Work or school days a week</p>'+seg('workDays',[0,1,2,3,4,5,6,7].map(n=>[n,n]),p.workDays)+'</div>'+
      '<label class="check"><input type="checkbox" data-f="shift" '+(p.shift?'checked':'')+'><span>I work rotating or night shifts</span></label>'+
      (p.shift?'<p class="tiny">Hypnos assumes daytime work, so its bedtime advice won’t fit rotating shifts yet. Duration and debt tracking still work.</p>':'')+
      '</div>'+nav()+'</div>';
  } else if(st===2){
    h='<div class="ob">'+prog+'<h2>On work days</h2><p class="muted">Think of a typical week. Use the time you actually fall asleep, not when you get into bed.</p><div class="grid2">'+
      '<label class="f">Fall asleep<input type="time" data-f="workSleep" value="'+p.workSleep+'"></label><label class="f">Wake up<input type="time" data-f="workWake" value="'+p.workWake+'"></label></div>'+
      '<p class="small muted">That’s '+fmtD(span(p.workSleep,p.workWake))+' of sleep. Your work-day wake time becomes your anchor, every day of the week.</p>'+nav()+'</div>';
  } else if(st===3){
    h='<div class="ob">'+prog+'<h2>On free days</h2><p class="muted">Days with nothing you have to get up for.</p><div class="grid2">'+
      '<label class="f">Fall asleep<input type="time" data-f="freeSleep" value="'+p.freeSleep+'"></label><label class="f">Wake up<input type="time" data-f="freeWake" value="'+p.freeWake+'"></label></div>'+
      '<label class="check"><input type="checkbox" data-f="freeAlarm" '+(p.freeAlarm?'checked':'')+'><span>I use an alarm on free days too</span></label>'+
      '<p class="small muted">Free-day sleep without an alarm is the best clue to how much sleep your body wants.</p>'+nav()+'</div>';
  } else if(st===4){
    h='<div class="ob">'+prog+'<h2>Winding down</h2><div class="stack"><div><p class="small muted">How long does it usually take you to fall asleep?</p>'+seg('latency',[[5,'5 min'],[15,'15 min'],[30,'30 min'],[45,'45 min +']],p.latency)+'</div>'+
      '<div><p class="small muted">Remind me to start winding down this long before lights out</p>'+seg('windDown',[[30,'30 min'],[45,'45 min'],[60,'60 min']],p.windDown)+'</div></div>'+nav()+'</div>';
  } else if(st===5){
    h='<div class="ob">'+prog+'<h2>A quick breathing check</h2><p class="muted">These eight questions (STOP-Bang) screen for sleep apnea, which more sleep can’t fix. Answers stay on your phone.</p><div>'+

  } else {

      '<div class="row between"><span class="muted">Lights out</span><span class="mid">'+fmtT(lo)+'</span></div>'+

      '<dl class="kv"><dt>Starting sleep need</dt><dd>'+fmtD(need)+'</dd><dt>Body clock (mid-sleep on free days)</dt><dd>'+fmtT(c.MSFsc)+', '+c.type.toLowerCase()+'</dd><dt>Social jetlag</dt><dd>'+fmtD(c.sjl)+'</dd><dt>Breathing check</dt><dd>'+p.stopbang+' of 8</dd></dl>'+

      nav('Start')+'</div>';

}
function finishOnboarding(){
  const p=ob.p;p.stopbang=Object.values(p.sb).filter(Boolean).length;
  if(ob.redo&&ob.keep){
    const k=ob.keep;k.profile=p;
    if(!k.need.manual&&!(k.need.history||[]).length)k.need.hours=seedNeed(p);
    S=k;persist();ob={step:0,p:null};tab='me';render();toast('Setup updated');return;
  }
  S={v:1,profile:p,need:{hours:seedNeed(p),updated:today(),history:[]},nights:{},dismiss:{},settings:{calm:false},created:today()};
  persist();tab='tonight';render();
}
function sample(){
  const p=defaultsProfile();p.sb={g:true};p.stopbang=1;
  S={v:1,profile:p,need:{hours:seedNeed(p),updated:today(),history:[]},nights:{},dismiss:{},settings:{calm:false},created:today(),sample:true};
  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  for(let i=1;i<=24;i++){
    const k=addDays(today(),-i),ev=parseKey(addDays(k,-1)).getDay(); /* weekday of the evening */
    const weekend=ev===5||ev===6;
    const on=weekend?toMin('00:20')+rnd()*60:toMin('23:05')+rnd()*50;
    const wk=weekend?toMin('08:20')+rnd()*60:toMin('06:25')+rnd()*15;
    const tags=[];if(rnd()<.3)tags.push('caffeine');if(weekend&&rnd()<.6)tags.push('alcohol');if(rnd()<.35)tags.push('screens');
    S.nights[k]={onset:hhmm(on),wake:hhmm(wk),nap:0,rested:weekend?4:(rnd()<.5?2:3),noAlarm:weekend,trouble:false,drowsy:false,tags};
  }
  persist();tab='tonight';render();
}

/* ---------- dial ---------- */
function arc(cx,cy,r,a0,a1){ /* minutes of day, midnight at top, clockwise */
  const A=m=>(mod(m)/1440)*2*Math.PI-Math.PI/2;
  let d=mod(a1-a0);if(d===0)d=1440;
  const p0=[cx+r*Math.cos(A(a0)),cy+r*Math.sin(A(a0))],p1=[cx+r*Math.cos(A(a0+d)),cy+r*Math.sin(A(a0+d))];
  return {d:'M'+p0[0].toFixed(2)+' '+p0[1].toFixed(2)+' A'+r+' '+r+' 0 '+(d>720?1:0)+' 1 '+p1[0].toFixed(2)+' '+p1[1].toFixed(2),len:(2*Math.PI*r*d/1440).toFixed(1)};
}
function pt(cx,cy,r,m){const a=(mod(m)/1440)*2*Math.PI-Math.PI/2;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]}
function dial(P){
  const c=160,R=118,now=new Date(),nowM=now.getHours()*60+now.getMinutes();
  let ticks='';for(let h=0;h<24;h++){const [x1,y1]=pt(c,c,R+16,h*60),[x2,y2]=pt(c,c,R+(h%6?20:26),h*60);ticks+='<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="#a99fc4" stroke-opacity="'+(h%6?.35:.8)+'" stroke-width="'+(h%6?1:1.6)+'"/>'}
  const labs=[[0,'12 am'],[360,'6 am'],[720,'12 pm'],[1080,'6 pm']].map(([m,t])=>{const [x,y]=pt(c,c,R+40,m);return '<text x="'+x.toFixed(1)+'" y="'+(y+4).toFixed(1)+'" text-anchor="middle" font-size="12" fill="#a99fc4">'+t+'</text>'}).join('');
  const wd=arc(c,c,R,P.windDown,P.lightsOut),sl=arc(c,c,R,P.asleep,P.wake),lat=arc(c,c,R,P.lightsOut,P.asleep);
  const [wx,wy]=pt(c,c,R,P.wake),[nx,ny]=pt(c,c,R-30,nowM),[mx,my]=pt(c,c,R-22,P.mid);
  return '<svg class="dial" viewBox="-12 -12 344 344" role="img" aria-label="Tonight: wind down at '+fmtT(P.windDown)+', lights out at '+fmtT(P.lightsOut)+', wake at '+fmtT(P.wake)+'">'+
    '<circle cx="'+c+'" cy="'+c+'" r="'+(R+8)+'" fill="#140f25"/>'+
    '<circle cx="'+c+'" cy="'+c+'" r="'+R+'" fill="none" stroke="rgba(239,233,247,.08)" stroke-width="18"/>'+ticks+labs+
    '<path d="'+wd.d+'" fill="none" stroke="#7a7096" stroke-width="18" stroke-linecap="round"/>'+
    '<path d="'+lat.d+'" fill="none" stroke="#c97c96" stroke-opacity=".5" stroke-width="18"/>'+
    '<path class="sweep" style="--len:'+sl.len+'" d="'+sl.d+'" fill="none" stroke="#f3a6bb" stroke-width="18" stroke-linecap="round"/>'+
    '<circle cx="'+wx.toFixed(1)+'" cy="'+wy.toFixed(1)+'" r="11" fill="#140f25" stroke="#efe9f7" stroke-width="2"/><circle cx="'+wx.toFixed(1)+'" cy="'+wy.toFixed(1)+'" r="4.5" fill="#efe9f7"/>'+
    '<circle cx="'+nx.toFixed(1)+'" cy="'+ny.toFixed(1)+'" r="5" fill="none" stroke="#efe9f7" stroke-opacity=".6" stroke-width="1.5"><title>Now</title></circle>'+
    '<text x="'+c+'" y="'+(c-30)+'" text-anchor="middle" font-size="13" fill="#a99fc4">Lights out</text>'+
    '<text x="'+c+'" y="'+(c+14)+'" text-anchor="middle" font-size="40" fill="#efe9f7" style="font-family:Newsreader,Georgia,serif">'+fmtT(P.lightsOut).replace(' ',' ')+'</text>'+
    '<text x="'+c+'" y="'+(c+40)+'" text-anchor="middle" font-size="13" fill="#a99fc4">Wake '+fmtT(P.wake).replace(' ',' ')+'</text></svg>';
}

/* ---------- screens ---------- */
function flagHTML(fl){return fl.map(f=>'<div class="flag '+(f.lvl==='urgent'?'urgent':'')+'"><h3>'+f.t+'</h3><p class="small muted">'+f.b+'</p>'+(f.x?'<button class="link" data-act="dismiss" data-id="'+f.id+'">I’ve talked to a doctor</button>':'')+'</div>').join('')}
function renderTonight(){

  h+='<h1>Tonight</h1><div class="dialwrap">'+dial(P)+'</div>'+
    '<div class="legend"><span><i style="background:#7a7096"></i>Wind down '+fmtT(P.windDown)+'</span><span><i style="background:#f3a6bb"></i>Asleep '+fmtD(P.target)+'</span><span><i style="background:#efe9f7"></i>Wake</span><span><i style="border:1.5px solid #efe9f7;opacity:.7"></i>Now</span></div>';
  h+='<div class="sec panel stack"><p>Aim for lights out between <b class="nowrap">'+fmtT(P.lightsOut-15)+'</b> and <b class="nowrap">'+fmtT(P.lightsOut)+'</b>.</p><p class="small muted">'+
    (P.extra?'That includes '+P.extra+' extra minutes to pay down your sleep debt, taken from bedtime so your wake time stays put.':P.hold?'No extra time tonight while falling or staying asleep is the problem.':'That covers your '+fmtD(P.need)+' sleep need plus about '+P.lat+' minutes to fall asleep.')+'</p>'+

    const pos=clamp(P.debt.debt/10,0,1)*100;
    h+='<div class="panel stack" style="margin-top:12px">'+(calm?'':'<div class="row between"><span class="big">'+P.debt.debt.toFixed(1)+'<span class="mid"> h</span></span><span class="small muted" style="max-width:55%;text-align:right">owed over the last 14 nights, recent nights weighted more</span></div>')+
      '<div><div class="meter" role="img" aria-label="Debt '+P.debt.debt.toFixed(1)+' hours, '+P.debt.band+'"><b style="left:'+pos+'%"></b></div><div class="meterlab"><span>0</span><span>2 h</span><span>5 h</span><span>10 h+</span></div></div></div>';

    h+='<div class="sec"><h2>Last night</h2><div class="panel" style="margin-top:12px"><div class="row between"><span class="mid">'+fmtD(d)+'</span><span class="'+(g<0?'':'muted')+'">'+(g>=0?fmtD(g)+' over need':fmtD(-g)+' short')+'</span></div><p class="small muted" style="margin-top:6px">'+fmtT(toMin(last.onset))+' to '+fmtT(toMin(last.wake))+', rested '+last.rested+' of 5</p></div></div>'}
  else if(!last)h+='<div class="sec panel quiet row between"><p>How did you sleep last night?</p><button data-act="go-log">Log last night</button></div>';
  if(calm){const k7=loggedKeys(7);if(k7.length)h+='<div class="sec panel quiet"><p class="muted small">Calm mode is on. This week you averaged <b>'+fmtD(avg(k7.map(k=>nightDur(S.nights[k]))))+'</b> a night.</p></div>'}
  if(Math.abs(P.chronoGap)>=2&&P.chronoGap>0)h+='<div class="sec panel quiet"><h3>Your body clock runs later than this plan</h3><p class="small muted" style="margin-top:6px">Your free-day mid-sleep is about '+fmtD(P.chronoGap)+' later than tonight’s. Shift gradually: move lights out 15 minutes earlier every 2 to 3 nights, and get bright light soon after you wake.</p></div>';

  const k14=loggedKeys(14,P.asOf),sOn=spread(k14,'onset'),sWk=spread(k14,'wake'),con=consistency();
  const c=chrono(S.profile);
  h+='<div class="sec"><h2>Regularity</h2><dl class="kv" style="margin-top:12px"><dt>Consistent nights in a row</dt><dd>'+con.streak+'</dd>'+
    (sOn!=null?'<dt>Bedtime varies by</dt><dd>±'+Math.round(sOn)+' min</dd>':'')+(sWk!=null?'<dt>Wake time varies by</dt><dd>±'+Math.round(sWk)+' min</dd>':'')+
    '<dt>Social jetlag (from setup)</dt><dd>'+fmtD(c.sjl)+'</dd></dl><p class="tiny" style="margin-top:8px">A consistent night means falling asleep within 30 minutes of your usual time. Regular timing matters as much for health as hours.</p></div>';
  const ins=tagInsights();
  h+='<div class="sec"><h2>What seems to affect you</h2>';
  if(ins.length)h+='<div class="list" style="margin-top:8px">'+ins.map(t=>'<div class="it"><div><b>'+t.label+'</b><div class="small muted">'+(Math.abs(t.dd)<1/12?'About the same sleep':fmtD(Math.abs(t.dd))+(t.dd<0?' less':' more')+' sleep')+', rest '+(t.dr>=0?'+':'−')+Math.abs(t.dr).toFixed(1)+'</div></div><span class="tiny nowrap">'+t.n1+' vs '+t.n0+' nights</span></div>').join('')+'</div><p class="tiny" style="margin-top:8px">Compared with nights without the tag, last 60 days. A pattern, not proof.</p>';
  else h+='<p class="muted" style="margin-top:8px">Tag your evenings when you log. Once a tag appears on 3 or more nights, its effect shows here.</p>';
  h+='</div>';
  const ex=experiment(ins,sOn,c);
  if(ex)h+='<div class="sec panel"><h3>Try this week</h3><p class="muted" style="margin-top:6px">'+ex+'</p></div>';
  app.innerHTML=h;
}
function experiment(ins,sOn,c){
  const bad=ins.find(t=>t.dd<-0.25||t.dr<-0.5);
  if(bad){const m={caffeine:'Keep coffee and tea before 2 pm',alcohol:'Skip alcohol on work nights',workout:'Finish workouts at least 3 hours before lights out',screens:'Leave your phone charging outside the bedroom',meal:'Finish dinner at least 2 to 3 hours before lights out',stress:'Write tomorrow’s to-do list before you start winding down'};return m[bad.id]+'. Keep tagging and compare next week.'}
  if(sOn!=null&&sOn>45)return 'Fall asleep within the same 30 minutes every night, weekends included.';
  if(c.sjl>=1)return 'On free days, wake up no more than an hour later than on work days.';
  return 'Keep doing what you’re doing. Steady timing is the hardest part, and you have it.';
}
function renderMe(){
  const p=S.profile,c=chrono(p),n=S.need;
  let h='<h1>You</h1><div class="sec"><h2>Sleep need</h2><div class="panel stack" style="margin-top:12px"><div class="row between"><span class="big">'+fmtD(n.hours)+'</span><span class="small muted" style="text-align:right">'+(n.manual?'set by you':'learned from your logs')+'</span></div>'+
    '<p class="small muted">Hypnos adjusts this by up to 15 minutes a week, using nights you woke without an alarm and felt rested (4 or 5), once your debt is Low. It stays between 7 and 9½ hours.</p>'+
    ((n.history||[]).length?'<p class="tiny">Changes: '+n.history.slice(-4).map(x=>dayLabel(x.date)+' '+fmtD(x.from)+' to '+fmtD(x.to)).join('; ')+'</p>':'')+
    '<div class="grid2"><label class="f">Set it yourself<select id="needsel">'+Array.from({length:11},(_,i)=>7+i/4).map(v=>'<option value="'+v+'" '+(Math.abs(v-n.hours)<0.01?'selected':'')+'>'+fmtD(v)+'</option>').join('')+'</select></label>'+
    '<label class="check" style="align-self:end"><input type="checkbox" id="needauto" '+(n.manual?'':'checked')+'><span>Keep learning</span></label></div></div></div>';
  h+='<div class="sec"><h2>Schedule</h2><form id="schedf" class="stack" style="margin-top:12px"><div class="grid2"><label class="f">Wake-up anchor<input type="time" name="workWake" value="'+p.workWake+'"></label><label class="f">Wind-down reminder<select name="windDown">'+[30,45,60].map(v=>'<option '+(Number(p.windDown)===v?'selected':'')+' value="'+v+'">'+v+' min before</option>').join('')+'</select></label></div>'+
    '<label class="f">Usual time to fall asleep<select name="latency">'+[5,15,30,45].map(v=>'<option '+(Number(p.latency)===v?'selected':'')+' value="'+v+'">'+v+' min</option>').join('')+'</select></label><button class="ghost" type="submit">Save schedule</button></form></div>';
  h+='<div class="sec"><h2>Body clock</h2><dl class="kv" style="margin-top:12px"><dt>Chronotype</dt><dd>'+c.type+'</dd><dt>Mid-sleep on free days</dt><dd>'+fmtT(c.MSFsc)+'</dd><dt>Social jetlag</dt><dd>'+fmtD(c.sjl)+'</dd><dt>Breathing check</dt><dd>'+p.stopbang+' of 8</dd></dl><button class="link" data-act="redo">Redo setup questions</button></div>';
  h+='<div class="sec"><h2>Reminders</h2><p class="small muted" style="margin-top:6px">Add a daily wind-down alert to your phone’s calendar at '+fmtT(mod(toMin(p.workWake)-n.hours*60-p.latency-p.windDown))+'. It uses your base bedtime; Hypnos shows tonight’s exact time.</p><div class="row" style="margin-top:10px"><button class="ghost" data-act="ics">Add wind-down reminder</button></div></div>';
  h+='<div class="sec"><h2>Calm mode</h2><label class="check" style="margin-top:6px"><input type="checkbox" id="calm" '+(S.settings.calm?'checked':'')+'><span>Hide nightly numbers and show weekly averages. Helpful if tracking makes you anxious about sleep.</span></label></div>';
  h+='<div class="sec"><h2>Your data</h2><p class="small muted" style="margin-top:6px">Everything stays on this phone. Export a backup now and then.</p><div class="row" style="margin-top:10px"><button class="ghost" data-act="export">Download backup</button><button class="ghost" data-act="copy">Copy backup</button></div>'+
    '<details style="margin-top:8px"><summary>Restore from a backup</summary><div class="stack"><input type="file" id="impfile" accept="application/json,.json"><textarea id="imptxt" placeholder="Or paste backup text here"></textarea><button class="ghost" data-act="import">Restore</button></div></details>'+
    (S.sample?'<button class="ghost full" style="margin-top:12px" data-act="clear-sample">Clear sample nights</button>':'')+
    '<button class="ghost full" style="margin-top:12px;border-color:var(--high);color:var(--high)" data-act="erase">'+(eraseArm?'Tap again to erase everything':'Erase all data')+'</button></div>';
  h+='<p class="tiny sec">Hypnos is a wellness tool for adults. It doesn’t diagnose or treat sleep disorders. If you snore loudly, stop breathing in your sleep, or can’t sleep most nights, talk to a doctor.</p>';
  app.innerHTML=h;
}
function render(){
  if(!S||!S.profile){renderOnboarding();return}
  tabs.hidden=false;
  for(const b of tabs.querySelectorAll('button'))b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false');
  ({tonight:renderTonight,log:renderLog,trends:renderTrends,me:renderMe})[tab]();
  window.scrollTo(0,0);
}

/* ---------- files ---------- */
function download(name,type,text){
  try{const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Downloading '+name)}
  catch(e){toast('Download blocked here. Use Copy instead.')}
}
function icsText(){
  const p=S.profile,m=mod(toMin(p.workWake)-S.need.hours*60-p.latency-p.windDown),lo=mod(m+Number(p.windDown));
  const d=new Date();const ds=d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
  const st=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Hypnos//Sleep//EN','BEGIN:VEVENT','UID:hypnos-winddown-'+Date.now()+'@hypnos','DTSTAMP:'+st,'DTSTART:'+ds+'T'+hhmm(m).replace(':','')+'00','DURATION:PT'+p.windDown+'M','RRULE:FREQ=DAILY','SUMMARY:Wind down for bed','DESCRIPTION:Lights out around '+fmtT(lo).replace(' ',' ')+'. Open Hypnos for tonight\'s exact time.','BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:PT0M','DESCRIPTION:Time to wind down','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;editKey=null;eraseArm=false;render();return}
  if(t.dataset.seg){
    const g=t.dataset.seg,v=t.dataset.v;
    for(const b of t.parentElement.querySelectorAll('button'))b.setAttribute('aria-pressed',b===t);
    if(!S||!S.profile){ob.p[g]=['workDays','latency','windDown'].includes(g)?Number(v):v;if(g!=='age')return;renderOnboarding()}
    return;
  }
  const a=t.dataset.act;if(!a)return;
  if(a==='ob-next'){
    if(ob.step===0&&!ob.p)ob.p=defaultsProfile();
    if(ob.step===5)ob.p.stopbang=Object.values(ob.p.sb).filter(Boolean).length;
    if(ob.step===6){finishOnboarding();return}
    ob.step++;renderOnboarding();window.scrollTo(0,0);
  }
  else if(a==='ob-back'){
    if(ob.redo&&ob.step===1){S=ob.keep;ob={step:0,p:null};tab='me';render();return}
    ob.step=Math.max(0,ob.step-1);renderOnboarding();
  }
  else if(a==='sample')sample();
  else if(a==='go-log'){tab='log';render()}
  else if(a==='edit'){editKey=t.dataset.k;render()}
  else if(a==='del-night'){delete S.nights[t.dataset.k];persist();editKey=null;toast('Night deleted');render()}
  else if(a==='dismiss'){S.dismiss[t.dataset.id]=true;persist();render()}
  else if(a==='redo'){ob={step:1,p:JSON.parse(JSON.stringify(S.profile)),redo:true,keep:S};S=null;tabs.hidden=true;renderOnboarding();window.scrollTo(0,0)}
  else if(a==='ics')download('hypnos-wind-down.ics','text/calendar',icsText());
  else if(a==='export')download('hypnos-backup-'+today()+'.json','application/json',JSON.stringify(S));
  else if(a==='copy'){navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast('Backup copied'),()=>toast('Copy blocked; use Download'))}
  else if(a==='import'){
    const f=document.getElementById('impfile').files[0],txt=document.getElementById('imptxt').value.trim();
    const apply=s=>{try{const d=JSON.parse(s);if(!d.profile||!d.nights)throw 0;S=d;persist();toast('Backup restored');tab='tonight';render()}catch(err){toast('That isn’t a Hypnos backup')}};
    if(f){f.text().then(apply)}else if(txt)apply(txt);else toast('Choose a file or paste a backup first');
  }
  else if(a==='clear-sample'){S.nights={};S.sample=false;S.need={hours:seedNeed(S.profile),updated:today(),history:[]};persist();toast('Sample nights cleared');tab='tonight';render()}
  else if(a==='erase'){if(!eraseArm){eraseArm=true;renderMe();return}try{localStorage.removeItem(KEY)}catch(e){}mem=null;S=null;ob={step:0,p:null};eraseArm=false;render()}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(!S||!S.profile){
    if(el.dataset.f){ob.p[el.dataset.f]=el.type==='checkbox'?el.checked:el.value;if(['shift','workSleep','workWake'].includes(el.dataset.f))renderOnboarding()}
    if(el.dataset.sb){ob.p.sb[el.dataset.sb]=el.checked}
    return;
  }
  if(el.id==='calm'){S.settings.calm=el.checked;persist();toast(el.checked?'Calm mode on':'Calm mode off')}
  if(el.id==='needsel'){S.need.hours=Number(el.value);S.need.manual=true;S.need.updated=today();persist();toast('Sleep need set to '+fmtD(S.need.hours));renderMe()}
  if(el.id==='needauto'){S.need.manual=!el.checked;persist();renderMe()}
  if(el.form&&el.form.id==='logf'&&el.name==='date'){const k=el.value;if(k){editKey=k;renderLog()}}
});
document.addEventListener('input',e=>{if(e.target.form&&e.target.form.id==='logf')updDur()});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='logf'){
    const k=f.date.value||today();
    const rested=Number(f.querySelector('[data-seg=rested][aria-pressed=true]')?.dataset.v||3);
    if(!f.onset.value||!f.wake.value){toast('Add both times first');return}
    const d=span(f.onset.value,f.wake.value);if(d<0.5||d>16){toast('Check the times: that’s '+fmtD(d));return}
    S.nights[k]={onset:f.onset.value,wake:f.wake.value,nap:Number(f.nap.value)||0,rested,noAlarm:f.noAlarm.checked,trouble:f.trouble.checked,drowsy:f.drowsy.checked,tags:[...f.querySelectorAll('[name=tag]:checked')].map(x=>x.value)};
    const learned=maybeLearn();persist();editKey=null;
    toast(learned?'Night saved. Sleep need now '+fmtD(learned.to):'Night saved');tab='tonight';render();
  }
  if(f.id==='schedf'){S.profile.workWake=f.workWake.value;S.profile.windDown=Number(f.windDown.value);S.profile.latency=Number(f.latency.value);persist();toast('Schedule saved')}
});
render();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
}
</script>
